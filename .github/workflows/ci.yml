name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 与 Dockerfile 一致：先装 CPU 版 torch，避免下载 CUDA 依赖
      - name: Install CPU torch
        run: pip install --no-deps --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0"

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests -q
